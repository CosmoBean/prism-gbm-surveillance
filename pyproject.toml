[project]
name = "prism-gbm-surveillance"
version = "0.2.0"
description = "Censoring-aware 120-day progression risk from post-treatment glioma surveillance MRI (MU-Glioma-Post, LUMIERE)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy",
    "scikit-learn==1.7.2",
    "scikit-survival>=0.26.0",
    "threadpoolctl",
    "nibabel==5.4.2",
    "SimpleITK==2.5.3",
    "pyradiomics==3.0.1",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# Everything under legacy/ (original PRISM radiomics search, SwinUNETR, MLP fusion, report agent).
legacy = [
    "shap==0.49.1",
    "optuna==4.8.0",
    "lightgbm==4.6.0",
    "matplotlib==3.10.8",
    "seaborn",
    "tqdm",
    "torch",
    "monai>=1.6.1",
    "einops>=0.8.2",
    "openai",
    "python-docx",
    "gdown",
    "datasets>=5.0.1",
    "gpustat>=1.1.1",
]
notebook = ["jupyter", "transformers"]

[project.scripts]
prism = "prism.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism"]

# pyradiomics 3.0.1 imports numpy in setup.py without declaring it
[tool.uv.extra-build-dependencies]
pyradiomics = ["numpy==2.2.6", "versioneer"]

# PyTorch built against CUDA 13.0 (legacy extra only)
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
